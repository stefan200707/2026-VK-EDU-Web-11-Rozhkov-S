<header class="top">
    <div class="container top-inner">
        <h1 class="logo"><a href="{% url 'index' %}">AskPupkin</a></h1>

        <form class="header-search" role="search" method="get" action="{% url 'index' %}">
            <input type="search" name="q" placeholder="Search" aria-label="Search" maxlength="100">
            {% if user.is_authenticated %}
            <a href="{% url 'ask' %}" class="btn btn-success">ASK!</a>
            {% else %}
            <span class="d-flex" tabindex="0" title="Войдите, чтобы задать вопрос">
                <button type="button" class="btn btn-success" disabled>ASK!</button>
            </span>
            {% endif %}
        </form>

        {% include 'core/includes/user_block.html' %}
    </div>
</header>

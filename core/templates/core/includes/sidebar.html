<aside class="col-lg-3 sidebar">
    <section class="mb-3">
        <h3>Popular Tags</h3>
        <div class="tag-cloud">
            {% for tag in popular_tags %}
            <a class="tag {{ tag.css }}" href="{% url 'tag' tag.name %}">{{ tag.name }}</a>
            {% endfor %}
        </div>
    </section>

    <section class="mb-3">
        <h3>Best Members</h3>
        <ul class="list-unstyled">
            {% for member in best_members %}
            <li><a href="{% url 'profile' %}">{{ member }}</a></li>
            {% endfor %}
        </ul>
    </section>
</aside>

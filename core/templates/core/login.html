{% extends 'core/base.html' %}

{% block title %}Log In — AskPupkin{% endblock %}

{% block content %}
<h2>Log In</h2>
{% include 'core/includes/form_errors.html' %}
<form class="login-form" method="post" action="{% url 'login' %}" novalidate>
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    {% for field in form %}
        {% include 'core/includes/form_field.html' %}
    {% endfor %}
    <div class="row">
        <div class="col-sm-9 offset-sm-3">
            <button type="submit" class="btn btn-primary">Log in!</button>
            <div class="mt-2"><a href="{% url 'signup' %}">create new account</a></div>
        </div>
    </div>
</form>
{% endblock %}

services:
  db:
    image: postgres:16
    env_file: .env.docker      # POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD
    ports:
      - "5433:5432"            # 5433 на хосте, чтобы не мешать локальному PostgreSQL
    volumes:
      - pgdata:/var/lib/postgresql/data   # данные базы не теряются при пересоздании контейнера
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    env_file: .env.docker
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy   # ждём, пока база начнёт принимать подключения
    volumes:
      - .:/app                 # код проекта: правки на хосте видны в контейнере
      - ./media:/app/media     # загруженные файлы не теряются при пересборке

volumes:
  pgdata:

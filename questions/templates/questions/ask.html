{% extends 'core/base.html' %}

{% block title %}New Question — AskPupkin{% endblock %}

{% block content %}
<h2>New Question</h2>
{% include 'core/includes/form_errors.html' %}
<form class="ask-form" method="post" action="{% url 'ask' %}" novalidate>
    {% csrf_token %}
    {% for field in form %}
        {% include 'core/includes/form_field.html' %}
    {% endfor %}
    <div class="row">
        <div class="col-sm-9 offset-sm-3">
            <button type="submit" class="btn btn-success">ASK!</button>
        </div>
    </div>
</form>
{% endblock %}

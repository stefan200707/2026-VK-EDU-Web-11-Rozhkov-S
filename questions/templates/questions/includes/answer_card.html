<article class="card mb-3">
    <div class="card-body d-flex gap-3">
        {% include 'questions/includes/author_side.html' with item=answer %}
        <div class="question-main">
            <p>{{ answer.text }}</p>
            <div class="question-meta">
                <span>{{ answer.author }}</span>
                <time datetime="{{ answer.created|date:'Y-m-d\TH:i' }}">{{ answer.created|date:'j M, H:i' }}</time>
            </div>
            <div class="form-check mt-2">
                <input class="form-check-input" type="checkbox" id="correct-{{ answer.id }}"{% if answer.is_correct %} checked{% endif %}>
                <label class="form-check-label" for="correct-{{ answer.id }}">Correct!</label>
            </div>
        </div>
    </div>
</article>

{# Левая колонка карточки: аватар автора и виджет лайков. Параметры: item (вопрос или ответ), size #}
{% load static %}{% static 'core/img/avatar-1.svg' as default_avatar %}
<div class="question-side">
    <img src="{{ item.author.profile.avatar_url|default:default_avatar }}" alt="Avatar of {{ item.author.profile|default:item.author.username }}" width="{{ size|default:64 }}" height="{{ size|default:64 }}" class="rounded">
    {% include 'questions/includes/likes.html' with rating=item.rating state=item.like_state %}
</div>

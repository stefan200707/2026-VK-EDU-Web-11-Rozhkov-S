{# Виджет лайков. Параметры: item — вопрос или ответ, kind — question или answer #}
<div class="likes" data-id="{{ item.id }}" data-url="{% if kind == 'answer' %}{% url 'answer_vote' %}{% else %}{% url 'question_vote' %}{% endif %}"
     {% if not user.is_authenticated %}title="Войдите, чтобы оценивать"{% endif %}>
    <span class="likes-count">{{ item.rating }}</span>
    <div class="likes-arrows">
        {% if user.is_authenticated %}
        <button type="button" class="like-btn{% if item.user_vote == 1 %} active{% endif %}" data-type="like" aria-label="Like"
                aria-pressed="{% if item.user_vote == 1 %}true{% else %}false{% endif %}"{% if item.user_vote == 1 %} disabled{% endif %}>▲</button>
        <button type="button" class="like-btn{% if item.user_vote == -1 %} active{% endif %}" data-type="dislike" aria-label="Dislike"
                aria-pressed="{% if item.user_vote == -1 %}true{% else %}false{% endif %}"{% if item.user_vote == -1 %} disabled{% endif %}>▼</button>
        {% else %}
        <button type="button" class="like-btn" aria-label="Like" title="Войдите, чтобы оценивать" disabled>▲</button>
        <button type="button" class="like-btn" aria-label="Dislike" title="Войдите, чтобы оценивать" disabled>▼</button>
        {% endif %}
    </div>
</div>
